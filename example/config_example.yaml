# Example Configuration for testing the pipeline
# To run this example: 
# snakemake --configfile example/config_example.yaml --cores 4

ensembl_version: "115"

# Inline Species Tree (Newick string matching species keys below)
species_tree: "((((MACFA:1,HUMAN:1)1:1,(RATNO:1,MOUSE:1)1:1)1:1,(PIGXX:1,CANLF:1)1:1)1:1);"

# =============================================================================
# INPUT & DATA PATHS
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # 1. USER-PROVIDED INPUT (THE ONLY REQUIRED INPUT FILE):
  #    Example CSV with 227 genes across 6 species.
  # ---------------------------------------------------------------------------
  metadata: "example/input/gene_metadata/target_gene_annotations_example.csv"

  # ---------------------------------------------------------------------------
  # 2. AUTO-MANAGED DATABASE & INTERMEDIATE DIRECTORIES:
  #    You do NOT need to prepare or download files for these directories.
  #    Snakemake will automatically download raw Ensembl data and generate
  #    these coordinates/transcripts during pipeline execution.
  # ---------------------------------------------------------------------------
  raw_homologies_dir: "input/DB/ensembl_homologies_raw"  # Auto-downloaded from Ensembl FTP
  genespace_coords: "input/DB/genespace_coords"          # Auto-generated from Ensembl GFF3
  fasta_dir: "input/DB/canonical_transcripts"            # Auto-generated canonical FASTAs

# =============================================================================
# TOOL EXECUTABLES
# =============================================================================
# Pre-installed in the conda environment (envs/orthology_env.yaml).
tools:
  mafft: "mafft"
  fasttree: "FastTree"
  treerecs: "treerecs"

output_dir: "example/output_example"

symbol_reference_species: "HUMAN"

# Compute phylogenetic trees and MSAs for multi-gene orthogroups
compute_trees: true

species:
  HUMAN:
    scientific_name: "homo_sapiens"
    assembly: "GRCh38"
  MOUSE:
    scientific_name: "mus_musculus"
    assembly: "GRCm39"
  MACFA:
    scientific_name: "macaca_fascicularis"
    assembly: "Macaca_fascicularis_6.0"
  RATNO:
    scientific_name: "rattus_norvegicus"
    assembly: "GRCr8"
  PIGXX:
    scientific_name: "sus_scrofa"
    assembly: "Sscrofa11.1"
  CANLF:
    scientific_name: "canis_lupus_familiaris"
    assembly: "ROS_Cfam_1.0"

synteny:
  goc_window: 5

