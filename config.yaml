# Configuration for Ensembl-Only Synteny-Adjusted Orthology Pipeline

ensembl_version: "115"

# Species Tree (Newick string or file path)
# Tip labels MUST match species keys defined below
species_tree: "((((MACFA:1,HUMAN:1)1:1,(RATNO:1,MOUSE:1)1:1)1:1,(PIGXX:1,CANLF:1)1:1)1:1);"

# =============================================================================
# INPUT & DATA PATHS
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # 1. USER-PROVIDED INPUT (THE ONLY REQUIRED INPUT FILE):
  #    A CSV file containing the list of target genes, canonical transcripts,
  #    and peptide IDs across all species.
  # ---------------------------------------------------------------------------
  metadata: "input/gene_metadata/target_gene_annotations.csv"

  # ---------------------------------------------------------------------------
  # 2. AUTO-MANAGED DATABASE & INTERMEDIATE DIRECTORIES:
  #    You do NOT need to prepare or download files for these directories.
  #    Snakemake will automatically download raw Ensembl data and generate
  #    these coordinates/transcripts during pipeline execution.
  # ---------------------------------------------------------------------------
  raw_homologies_dir: "input/DB/ensembl_homologies_raw"  # Auto-downloaded from Ensembl FTP
  genespace_coords: "input/DB/genespace_coords"          # Auto-generated from Ensembl GFF3
  fasta_dir: "input/DB/canonical_transcripts"            # Auto-generated canonical FASTAs

# =============================================================================
# TOOL EXECUTABLES
# =============================================================================
# All tools (mafft, FastTree, and treerecs) are pre-installed in the conda
# environment (envs/orthology_env.yaml). Override only if using custom paths.
tools:
  mafft: "mafft"
  fasttree: "FastTree"
  treerecs: "treerecs"

# Number of parallel threads for synteny and tree computation
threads: 8

# Output directory for the new pipeline results
output_dir: "ensembl_pipeline_output"

# Reference species for consensus symbols (defaults to first in list if not set)
symbol_reference_species: "HUMAN"

# Target species definition
# Ensure the scientific name matches the Ensembl homology file prefixes
# e.g., "homo_sapiens.tsv.gz"
species:
  HUMAN:
    scientific_name: "homo_sapiens"
    assembly: "GRCh38"
  MOUSE:
    scientific_name: "mus_musculus"
    assembly: "GRCm39"
  MACFA:
    scientific_name: "macaca_fascicularis"
    assembly: "Macaca_fascicularis_6.0"
  RATNO:
    scientific_name: "rattus_norvegicus"
    assembly: "GRCr8"
  PIGXX:
    scientific_name: "sus_scrofa"
    assembly: "Sscrofa11.1"
  CANLF:
    scientific_name: "canis_lupus_familiaris"
    assembly: "ROS_Cfam_1.0"

# Synteny Parameters
synteny:
  goc_window: 5

# Optional Phylogenetic Tree & MSA computation (Rule 7)
compute_trees: true

# Tree building & species-tree reconciliation parameters (Rule 7)
trees:
  contraction_threshold: 0.8  # Treerecs SH-support threshold to collapse weak branches (default: 0.8; set 'none' to disable)
  reroot: true                # Reroot gene trees using species tree reconciliation cost


